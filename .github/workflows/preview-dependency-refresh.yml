name: Refresh preview dependency lockfile

on:
  push:
    branches:
      - fix/preview-imagekit-video-playback
    paths:
      - tools-versions.json
      - package.json
      - scripts/sync-tools.mjs
      - .github/workflows/preview-dependency-refresh.yml

permissions:
  contents: write

concurrency:
  group: preview-lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'carlosprztours/prz-tours'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preview-imagekit-video-playback
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync central catalog
        run: npm run tools:sync
      - name: Resolve patched dependencies without installing scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Apply compatible transitive security fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Check catalog consistency
        run: npm run tools:check
      - name: Commit only dependency manifests to preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): refresh preview lockfile with compatible patches"
            git push origin HEAD:fix/preview-imagekit-video-playback
          fi
