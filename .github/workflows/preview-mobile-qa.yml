name: Preview mobile QA
on:
  push:
    branches: [fix/preview-imagekit-video-playback]
    paths: [.github/workflows/preview-mobile-qa.yml]
permissions:
  contents: read
jobs:
  mobile:
    if: github.repository == 'carlosprztours/prz-tours'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx --no-install playwright-core install chromium
      - name: Mobile playback and layout
        run: |
          mkdir -p mobile-evidence
          node --input-type=module <<'JS'
          import { chromium, devices } from 'playwright-core';
          import { writeFile } from 'node:fs/promises';
          const origin = 'https://prz-tours-video-preview.carlosprz-tours.workers.dev';
          const browser = await chromium.launch();
          const results = [];
          try {
            for (const device of ['Pixel 7', 'iPhone 13']) {
              const context = await browser.newContext({ ...devices[device], defaultBrowserType: 'chromium' });
              await context.tracing.start({ screenshots: true, snapshots: true });
              const page = await context.newPage();
              page.setDefaultTimeout(8000);
              for (const locale of ['es', 'en']) {
                for (const suffix of ['', '/gallery']) {
                  const name = [device, locale, suffix ? 'gallery' : 'home'].join('-').replaceAll(' ', '-');
                  try {
                    const response = await page.goto(origin + '/' + locale + suffix, { waitUntil: 'domcontentloaded' });
                    if (!response?.ok()) throw Error('HTTP ' + response?.status());
                    await page.getByRole('button', { name: /^(Reproducir|Play).*ImageKit/i }).tap();
                    const video = page.locator('video').first();
                    await video.waitFor({ state: 'visible' });
                    await page.waitForFunction(() => document.querySelector('video')?.currentTime > 0.15);
                    await video.press('Space');
                    await page.waitForFunction(() => document.querySelector('video')?.paused);
                    const state = await video.evaluate(v => ({
                      time: v.currentTime, paused: v.paused, mediaError: v.error?.code ?? null,
                      hls: /\.m3u8(?:\?|$)/i.test(v.currentSrc),
                      width: document.documentElement.clientWidth,
                      scrollWidth: document.documentElement.scrollWidth
                    }));
                    results.push({ name, ...state, pass: state.mediaError === null && state.scrollWidth <= state.width + 1 });
                  } catch (error) {
                    results.push({ name, pass: false, error: String(error.message).split('\n')[0] });
                  }
                  await page.screenshot({ path: 'mobile-evidence/' + name + '.png' });
                }
              }
              await context.tracing.stop({ path: 'mobile-evidence/' + device.replaceAll(' ', '-') + '.zip' });
              await context.close();
            }
          } finally {
            await browser.close();
            await writeFile('mobile-evidence/results.json', JSON.stringify(results, null, 2));
            console.log(JSON.stringify(results));
          }
          if (results.some(r => !r.pass)) process.exitCode = 1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-mobile-evidence
          path: mobile-evidence
          retention-days: 2
