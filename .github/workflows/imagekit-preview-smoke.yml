name: ImageKit preview smoke

on:
  workflow_dispatch:
  push:
    branches: [fix/preview-imagekit-video-playback]
    paths: ['.github/workflows/imagekit-preview-smoke.yml']

permissions:
  contents: read

concurrency:
  group: imagekit-preview-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/fix/preview-imagekit-video-playback'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Upload and verify cleanup
        run: node scripts/imagekit-preview-smoke.mjs
        env:
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_URL_ENDPOINT: ${{ vars.IMAGEKIT_URL_ENDPOINT || 'https://ik.imagekit.io/PrzCV' }}
          IMAGEKIT_VERIFY_FOLDER: /prz/preview-smoke-c4d7eac0-b7c6-48f7-97b8-75e392f6997a
      - name: Preserve cleanup manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imagekit-preview-manifest
          path: imagekit-preview-manifest.json
          retention-days: 3
