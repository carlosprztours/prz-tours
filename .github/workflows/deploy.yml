name: Deploy a Cloudflare

on:
  push:
    branches: [main, fix/preview-imagekit-video-playback]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Concurrencia: cancela deploys anteriores si llega uno nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Verificación: corre en cada push y PR
  # ------------------------------------------------------------------
  verify:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar versión centralizada
        run: npm run version:check

      - name: Verificar catálogo de herramientas
        run: npm run tools:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: Validar contenido (sin texto corrupto)
        run: node scripts/check-content.mjs

  # ------------------------------------------------------------------
  # Auditoría separada: no oculta el detalle ni despliega.
  # ------------------------------------------------------------------
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verificar catálogo antes de auditar
        run: npm run tools:check
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Auditoría completa de dependencias
        if: always()
        run: npm audit --audit-level=high

  # ------------------------------------------------------------------
  # Build del bundle de OpenNext (no despliega)
  # ------------------------------------------------------------------
  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext
        run: npx opennextjs-cloudflare build

  # ------------------------------------------------------------------
  # Deploy real (solo en main)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy a Cloudflare Workers
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar migraciones D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply prz-tours --remote

      - name: Build y publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  # Preview aislado: no utiliza environment production, rutas ni D1 productiva.
  deploy_preview:
    name: Deploy isolated preview
    needs: [build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/preview-imagekit-video-playback' && github.repository == 'carlosprztours/prz-tours'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate isolated preview config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('wrangler.preview.jsonc', 'utf8').replace(/^\s*\/\/.*$/gm, ''));
          if (cfg.name !== 'prz-tours-video-preview' ||
              cfg.routes?.length ||
              cfg.d1_databases?.length !== 1 ||
              cfg.d1_databases[0].database_id !== '6c3b5f55-8c63-4127-8e6b-6e1f4beee747' ||
              cfg.services?.[0]?.service !== cfg.name) {
            throw new Error('Unsafe preview configuration');
          }
          NODE
      - name: Build and deploy isolated preview (no D1 migrations)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx opennextjs-cloudflare build
          npx opennextjs-cloudflare deploy --config wrangler.preview.jsonc
