name: Deploy a Cloudflare

on:
  push:
    branches: [main]
    # Release-tooling repairs must not replace the already approved Worker.
    paths-ignore:
      - .github/workflows/deploy.yml
      - docs/RELEASES.md
      - scripts/release.mjs
      - scripts/publish-release.mjs
      - scripts/lib/release-publication.mjs
      - scripts/test-versioning.mjs
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy, release]
        default: deploy
      approved_sha:
        description: SHA exacto aprobado (solo release)
        type: string
      deploy_run_id:
        description: ID de ejecución exitosa de despliegue (solo release)
        type: string

# Concurrencia: cancela deploys anteriores si llega uno nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Verificación: corre en cada push y PR
  # ------------------------------------------------------------------
  verify:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - run: npm run tools:check && npm run release:check && npm run test:versioning && node --test scripts/test-upload-batches.mjs
      - run: node scripts/test-polish-loyalty.mjs && node --test scripts/test-editorial-release.mjs

      - run: npm audit --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: Validar contenido (sin texto corrupto)
        run: node scripts/check-content.mjs

  # ------------------------------------------------------------------
  # Build del bundle de OpenNext (no despliega)
  # ------------------------------------------------------------------
  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext
        run: npx opennextjs-cloudflare build

      - name: Probar operaciones y galería en D1 aislada
        if: github.event_name == 'pull_request'
        timeout-minutes: 8
        run: |
          if command -v google-chrome >/dev/null; then
            export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          elif ! timeout 75s npx playwright-core install --only-shell chromium; then
            browser_dir="$RUNNER_TEMP/prz-chromium"
            npm install --prefix "$browser_dir" --no-audit --no-fund @sparticuz/chromium@131.0.1
            export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node -e 'require(process.argv[1]).executablePath().then(console.log)' "$browser_dir/node_modules/@sparticuz/chromium")"
            test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE"
          fi
          node scripts/test-immersive-gallery.mjs
          node scripts/test-driver-operations.mjs

  # ------------------------------------------------------------------
  # Deploy real (solo en main)
  # ------------------------------------------------------------------
  deploy:
    name: Deploy a Cloudflare Workers
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.operation != 'release'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar migraciones D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply prz-tours --remote

      - name: Build y publicar
        env:
          PRZ_BUILD_SHA: ${{ github.sha }}
          PRZ_BUILD_ENV: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy


  release:
    name: Publicar release aprobada
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:prepare
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
      - name: Publicar SHA autorizado
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
        run: node scripts/publish-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agencyos-update-published
          path: .release/agencyos-update.published.json
          if-no-files-found: error
          retention-days: 7
